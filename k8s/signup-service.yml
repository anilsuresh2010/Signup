docker-build-push-ecr:
  runs-on: ubuntu-latest
  needs: package
  if: github.ref == 'refs/heads/main'
  outputs:
    image-tag: ${{ steps.extract-tag.outputs.image-tag }}
    image-uri: ${{ steps.extract-tag.outputs.image-uri }}
  steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        flavor: |
          latest=false
        tags: |
          type=sha,prefix=

    - name: Extract image details
      id: extract-tag
      run: |
        FIRST_TAG="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
        IMAGE_TAG="${FIRST_TAG##*:}"
        echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
        echo "image-uri=${FIRST_TAG}" >> $GITHUB_OUTPUT

    - name: Build and push Docker image to ECR
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

deploy-to-eks:
  runs-on: ubuntu-latest
  needs: docker-build-push-ecr
  if: github.ref == 'refs/heads/main'
  steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Update kubeconfig for EKS
      run: |
        aws eks update-kubeconfig \
          --name ${{ secrets.EKS_CLUSTER_NAME }} \
          --region ${{ env.AWS_REGION }}

    - name: Apply Kubernetes manifests
      run: |
        kubectl apply -f k8s/signup-service.yml

    - name: Update deployment image
      run: |
        kubectl set image deployment/signup-service \
          signup-service=${{ needs.docker-build-push-ecr.outputs.image-uri }}

    - name: Verify rollout
      run: |
        kubectl rollout status deployment/signup-service

deploy-production:
  runs-on: ubuntu-latest
  needs: [package, docker-build-push-ecr, deploy-to-eks]
  if: github.ref == 'refs/heads/main'
  environment: production
  steps:
    - name: Production deploy summary
      run: |
        echo "Production deploy completed for Signup Service."
        echo "Image pushed to ECR and deployment applied to EKS."