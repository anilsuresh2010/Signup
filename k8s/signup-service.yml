deploy-to-eks:
  runs-on: ubuntu-latest
  needs: docker-build-push-ecr
  if: github.ref == 'refs/heads/main'
  steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Update kubeconfig for EKS
      run: |
        aws eks update-kubeconfig \
          --name ${{ secrets.EKS_CLUSTER_NAME }} \
          --region ${{ env.AWS_REGION }}

    - name: Apply Kubernetes manifests
      run: |
        kubectl apply -f k8s/signup-service.yml

deploy-production:
  runs-on: ubuntu-latest
  needs: [package, docker-build-push-ecr, deploy-to-eks]
  if: github.ref == 'refs/heads/main'
  environment: production
  steps:
    - name: Production deploy summary
      run: |
        echo "Production deploy completed for Signup Service."
        echo "Image pushed to ECR and deployment applied to EKS."